name: Source and notebook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install numpy soundfile
      - run: python -m compileall -q studio app.py bootstrap.py download_models.py launch_web.py run_job.py tools
      - run: python -m unittest discover -s tests -v
